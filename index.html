<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exness Signal Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        <header class="flex justify-between items-center bg-gray-900 p-4 rounded-2xl border border-gray-800">
            <div>
                <h1 class="font-bold text-sm text-emerald-400">EXNESS SIGNAL MONITOR</h1>
                <p id="statusText" class="text-[11px] text-gray-400">Connecting...</p>
            </div>
            <button onclick="fetchSignals()" class="bg-emerald-500 active:scale-95 text-gray-950 px-3 py-1.5 rounded-xl text-xs font-bold">Refresh</button>
        </header>

        <div id="signalsContainer" class="space-y-3">
            <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl text-center text-xs text-gray-400">
                Waiting for incoming signals...
            </div>
        </div>
    </div>

    <script>
        // PASTE YOUR RENDER URL BELOW (keep /api/signals at the end)
        const BACKEND_URL = "YOUR_RENDER_URL_HERE/api/signals";

        async function fetchSignals() {
            const statusText = document.getElementById('statusText');
            try {
                const response = await fetch(BACKEND_URL);
                const result = await response.json();
                statusText.textContent = "Live • Auto-refreshing";
                statusText.className = "text-[11px] text-emerald-400";

                const container = document.getElementById('signalsContainer');
                if (result.status === "success" && result.data.length > 0) {
                    container.innerHTML = result.data.map(sig => `
                        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-2">
                            <div class="flex justify-between items-center text-xs font-mono">
                                <span class="text-white font-bold text-sm">${sig.symbol}</span>
                                <span class="${sig.action.toUpperCase() === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'} px-2.5 py-0.5 rounded-lg font-bold">${sig.action.toUpperCase()}</span>
                            </div>
                            <div class="flex justify-between text-xs text-gray-300">
                                <span>Entry/Alert Price: <strong class="text-white">${sig.price}</strong></span>
                                <span class="text-gray-500 text-[11px]">${sig.time || ''}</span>
                            </div>
                            <div class="text-xs text-gray-400 border-t border-gray-800 pt-2">${sig.message}</div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                statusText.textContent = "Waking up server (wait 30s)...";
                statusText.className = "text-[11px] text-amber-400";
            }
        }

        setInterval(fetchSignals, 5000);
        fetchSignals();
    </script>
</body>
</html>
