        tailwind.config = {

            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }

<body class="bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Slide-out Navigation Drawer -->

                    <span class="font-extrabold text-base text-gray-900 dark:text-white group-hover:text-amber-400 transition">WINS1 <span class="text-amber-400">VIP</span></span>
                </div>
                <button id="closeDrawerBtn" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <nav class="space-y-1.5" id="drawerNavList">
                <div class="text-[10px] font-mono text-amber-400 uppercase tracking-wider px-2 pt-1 font-bold flex items-center justify-between">
                    <span>🎯 LIVE DATA VIP MARKETS</span>
                </div>
                <button onclick="switchCategory('single_home')" id="nav_single_home" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-amber-500/20 text-amber-400 font-bold text-xs border border-amber-500/40 transition">

                    <span class="flex items-center gap-1.5">⚽ High-Scoring Over 1.5</span>

                    <span class="flex items-center gap-1.5">⚡ Even-Attack BTTS Yes</span>

            <!-- SETTINGS: DARK / LIGHT MODE - ADDED AS YOU ASKED -->
            <div class="pt-3 border-t border-gray-200 dark:border-gray-800 space-y-2">
                <label class="text-[11px] text-gray-500 dark:text-gray-400 font-mono block font-bold">⚙️ SETTINGS</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTheme('dark')" id="settingsDarkBtn" class="px-3 py-2.5 rounded-xl text-xs font-bold bg-gray-900 text-white border border-gray-700 transition">🌙 Dark Mode</button>
                    <button onclick="setTheme('light')" id="settingsLightBtn" class="px-3 py-2.5 rounded-xl text-xs font-bold bg-white text-gray-900 border border-gray-300 transition">☀️ Light Mode</button>

            <div class="pt-3 border-t border-gray-200 dark:border-gray-800 space-y-2">
                <label class="text-[11px] text-gray-500 dark:text-gray-400 font-mono block">Jump to Calendar Date (-60 to +30):</label>
                <input type="date" id="drawerCalendarInput" onchange="jumpToDate(this.value)" class="w-full bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-gray-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-amber-500">

        <div class="pt-4 border-t border-gray-200 dark:border-gray-800 text-center my-2">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-gray-900/90 border-b border-gray-200 dark:border-gray-800 px-4 py-3 backdrop-blur-md">

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div onclick="goToHomepage()" class="flex items-center space-x-3 cursor-pointer group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center font-black text-gray-950 text-lg group-hover:scale-105 transition shadow-lg">W1</div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h1 class="font-extrabold text-lg text-gray-900 dark:text-white group-hover:text-amber-400 transition">WINS1 <span class="text-amber-400">VIP</span></h1>
                            <span class="bg-emerald-500/10 text-emerald-500 dark:text-emerald-400 border border-emerald-500/20 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-live"></span> <span id="headerCategoryBadge">TOP HOME FAVORITE (1)</span>

            </div>
            <div class="flex items-center space-x-2">
                <button onclick="triggerRefresh()" id="refreshBtn" title="Refresh Match Data" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition flex items-center gap-1.5 text-xs font-mono">
                    <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="hidden sm:inline">Refresh</span>
                </button>
                <button id="themeToggleBtn" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>
        </div>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Date Ribbon (-60 to +30 Days) -->
        <div class="flex items-center justify-between bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-1.5 no-scrollbar overflow-x-auto gap-2" id="dateRibbon"></div>

        <!-- Ticket Section Header -->
        <section class="space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <div>
                    <h3 class="font-bold text-gray-900 dark:text-white text-base flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-live" id="sectionHeaderDot"></span> <span id="sectionTitleDate">TODAY'S</span> <span id="sectionTitleCategory">TOP HOME FAVORITE (1)</span>
                    </h3>
                    <p class="text-[11px] text-emerald-500 dark:text-emerald-400 font-mono mt-0.5">
                        <span id="strategySubtext">📊 Live API Filter: Season Win %, Implied Market Odds, Form & Table Gap</span>
                    </p>
                </div>
                <span class="text-xs bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl font-mono font-bold shadow-lg shadow-amber-500/5" id="totalOddsBadge">
                    ODDS: 0.00
                </span>
            </div>

            <!-- Feed Matches Container -->
            <div class="grid grid-cols-1 gap-3" id="matchFeedContainer"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 py-6 px-4 text-center mt-auto">
        <p class="text-xs text-gray-500 dark:text-gray-400">
            Sponsored by <a href="https://one.exnessonelink.com/a/m3alh1ljmu?source=app" target="_blank" class="text-amber-500 font-semibold underline">Exness Global Markets</a>
        </p>
    </footer>

    <script>
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const drawerMenu = document.getElementById('drawerMenu');
        const drawerBackdrop = document.getElementById('drawerBackdrop');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        // SETTINGS THEME - ADDED AS YOU ASKED, SAVED IN localStorage
        function setTheme(mode) {
            if (mode === 'dark') {
                document.documentElement.classList.add('dark');
                if (themeIcon) themeIcon.textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                if (themeIcon) themeIcon.textContent = '🌙';
            }
            try { localStorage.setItem('wins1_theme', mode); } catch(e) {}
            updateSettingsButtons(mode);
        }
        function updateSettingsButtons(mode) {
            const dBtn = document.getElementById('settingsDarkBtn');
            const lBtn = document.getElementById('settingsLightBtn');
            if (!dBtn || !lBtn) return;
            if (mode === 'dark') {
                dBtn.className = "px-3 py-2.5 rounded-xl text-xs font-bold bg-gray-900 text-white border-2 border-amber-500 transition";
                lBtn.className = "px-3 py-2.5 rounded-xl text-xs font-bold bg-white text-gray-900 border border-gray-300 transition";
            } else {
                dBtn.className = "px-3 py-2.5 rounded-xl text-xs font-bold bg-gray-900 text-white border border-gray-700 transition";
                lBtn.className = "px-3 py-2.5 rounded-xl text-xs font-bold bg-white text-gray-900 border-2 border-amber-500 transition";
            }
        }
        // Load saved theme on start, default dark
        (function(){
            let saved = 'dark';
            try { saved = localStorage.getItem('wins1_theme') || 'dark'; } catch(e) {}
            setTheme(saved);
        })();

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                setTheme(isDark ? 'light' : 'dark');
            });
        }

        function toggleDrawer(open) {
            if (!drawerMenu || !drawerBackdrop) return;
            if (open) {
                drawerBackdrop.classList.remove('hidden');
                drawerMenu.classList.remove('-translate-x-full');
            } else {
                drawerMenu.classList.add('-translate-x-full');
                drawerBackdrop.classList.add('hidden');
            }
        }

        if (openDrawerBtn) openDrawerBtn.addEventListener('click', () => toggleDrawer(true));
        if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', () => toggleDrawer(false));
        if (drawerBackdrop) drawerBackdrop.addEventListener('click', () => toggleDrawer(false));

        function getYYYYMMDD(d) {
            return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        }

        function toInputDateValue(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        let selectedDateObj = new Date();
        let currentCategory = 'single_home';
        const categories = ['single_home', 'single_away', 'single_over15', 'single_btts'];

        function initRibbon() {
            const ribbon = document.getElementById('dateRibbon');
            const calInput = document.getElementById('drawerCalendarInput');
            if (calInput) calInput.value = toInputDateValue(selectedDateObj);
            if (!ribbon) return;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const selectedZero = new Date(selectedDateObj);
            selectedZero.setHours(0, 0, 0, 0);

            let html = '';
            for (let offset = -60; offset <= 30; offset++) {
                const d = new Date(today);
                d.setDate(today.getDate() + offset);
                const isSelected = d.getTime() === selectedZero.getTime();
                const isToday = offset === 0;
                const dayLabel = isToday ? 'TODAY' : d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
                const dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const isoVal = toInputDateValue(d);

                html += `
                    <button type="button" onclick="jumpToDate('${isoVal}')" class="shrink-0 px-3 py-1.5 rounded-lg text-left transition ${
                        isSelected
                            ? 'bg-amber-500 text-gray-950 font-bold shadow'
                            : 'bg-gray-100 dark:bg-gray-800/70 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 hover:text-black dark:hover:text-white'
                    }">
                        <div class="text-[10px] font-mono leading-tight">${dayLabel}</div>
                        <div class="text-xs font-bold leading-tight">${dateLabel}</div>
                    </button>
                `;
            }
            ribbon.innerHTML = html;
        }

        // Lock selected match IDs in localStorage so live score changes never alter the pick
        function getLockedPick(dateStr, category) {
            try {
                const store = JSON.parse(localStorage.getItem('wins1_real_locked_picks') || '{}');
                return store[`${dateStr}_${category}`] || null;
            } catch (e) {
                return null;
            }
        }

        function saveLockedPick(dateStr, category, matchIdentifier) {
            try {
                const store = JSON.parse(localStorage.getItem('wins1_real_locked_picks') || '{}');
                store[`${dateStr}_${category}`] = matchIdentifier;
                localStorage.setItem('wins1_real_locked_picks', JSON.stringify(store));
            } catch (e) {}
        }

        function goToHomepage() {
            toggleDrawer(false);
            selectedDateObj = new Date();
            switchCategory('single_home');
            initRibbon();
        }

        function switchCategory(cat) {
            currentCategory = cat;
            toggleDrawer(false);

            categories.forEach(c => {
                const navBtn = document.getElementById(`nav_${c}`);
                if (navBtn) {
                    if (c === cat) {
                        navBtn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-amber-500/20 text-amber-400 font-bold text-xs border border-amber-500/40 transition";
                    } else {
                        navBtn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800 font-medium text-xs transition";
                    }
                }
            });

            const badgeText = {
                'single_home': "TOP HOME FAVORITE (1)",
                'single_away': "TOP AWAY FAVORITE (2)",
                'single_over15': "HIGH-SCORING OVER 1.5",
                'single_btts': "EVEN-ATTACK BTTS YES"
            };

            document.getElementById('headerCategoryBadge').textContent = badgeText[cat] || "LIVE VIP";
            document.getElementById('sectionTitleCategory').textContent = badgeText[cat] || "SELECTION";
            fetchMatchData(selectedDateObj, false);
        }

        function jumpToDate(dateStr) {
            if (!dateStr) return;
            const target = new Date(dateStr + 'T00:00:00');
            selectedDateObj = target;
            toggleDrawer(false);
            initRibbon();
            fetchMatchData(target, false);
        }

        function triggerRefresh() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('animate-spin');
            fetchMatchData(selectedDateObj, false).then(() => {
                setTimeout(() => {
                    if (icon) icon.classList.remove('animate-spin');
                }, 500);
            });
        }

        // Helper: Parse ESPN record strings like "10-2-3" (W-D-L) or "10-3" (W-L) into win rates
        function parseRecordStats(recordSummary) {
            if (!recordSummary || typeof recordSummary !== 'string') {
                return { wins: 0, draws: 0, losses: 0, played: 0, winRate: 0.40, lossRate: 0.35, summary: "N/A" };
            }
            const parts = recordSummary.split('-').map(n => parseInt(n, 10)).filter(n => !isNaN(n));
            if (parts.length === 3) {
                const [w, d, l] = parts;
                const played = w + d + l;
                return {
                    wins: w, draws: d, losses: l, played,
                    winRate: played > 0 ? (w / played) : 0.40,
                    lossRate: played > 0 ? (l / played) : 0.35,
                    summary: `${w}W-${d}D-${l}L`
                };
            } else if (parts.length === 2) {
                const [w, l] = parts;
                const played = w + l;
                return {
                    wins: w, draws: 0, losses: l, played,
                    winRate: played > 0 ? (w / played) : 0.40,
                    lossRate: played > 0 ? (l / played) : 0.35,
                    summary: `${w}W-${l}L`
                };
            }
            return { wins: 0, draws: 0, losses: 0, played: 0, winRate: 0.40, lossRate: 0.35, summary: recordSummary };
        }

        // Helper: Convert American Moneyline (-250, +180) to Decimal Odds (1.40, 2.80)
        function americanToDecimal(ml) {
            const num = parseFloat(ml);
            if (isNaN(num) || num === 0) return null;
            if (num < 0) return parseFloat((1 + (100 / Math.abs(num))).toFixed(2));
            return parseFloat((1 + (num / 100)).toFixed(2));
        }

        // REAL DATA ANALYTICS ENGINE
        function evaluatePickWithRealData(match, category) {
            const hRec = parseRecordStats(match.homeRecord);
            const aRec = parseRecordStats(match.awayRecord);

            const realHomeOdd = americanToDecimal(match.homeMoneyline);
            const realAwayOdd = americanToDecimal(match.awayMoneyline);
            const realOverUnder = parseFloat(match.overUnderLine) || null;

            let homeWinProb = Math.min(0.92, Math.max(0.15, (hRec.winRate * 0.6) + (aRec.lossRate * 0.4) + 0.08));
            let awayWinProb = Math.min(0.90, Math.max(0.12, (aRec.winRate * 0.6) + (hRec.lossRate * 0.4) - 0.04));

            if (realHomeOdd && realHomeOdd > 1.01) {
                const impliedHome = 1 / realHomeOdd;
                homeWinProb = (impliedHome * 0.7) + (homeWinProb * 0.3);
            }
            if (realAwayOdd && realAwayOdd > 1.01) {
                const impliedAway = 1 / realAwayOdd;
                awayWinProb = (impliedAway * 0.7) + (awayWinProb * 0.3);
            }

            const attackingTempo = (hRec.winRate + hRec.lossRate + aRec.winRate + aRec.lossRate) / 2;
            const ouBoost = realOverUnder ? (realOverUnder >= 2.5 ? 0.15 : -0.05) : 0;
            const over15Prob = Math.min(0.94, Math.max(0.55, 0.65 + (attackingTempo * 0.25) + ouBoost));
            const over25Prob = Math.min(0.85, Math.max(0.35, 0.42 + (attackingTempo * 0.35) + ouBoost));

            const balancedStrength = 1 - Math.abs(hRec.winRate - aRec.winRate);
            const bttsProb = Math.min(0.84, Math.max(0.38, (balancedStrength * 0.45) + (attackingTempo * 0.35) + ouBoost));

            let label = "Full Time Result: Home Win (1)";
            let odd = realHomeOdd || parseFloat((1 / homeWinProb).toFixed(2));
            let winProb = homeWinProb;
            let scoreRank = 0;
            let isWon = false;

            if (category === 'single_home') {
                label = "Full Time Result: Home Win (1)";
                odd = realHomeOdd || parseFloat((1 / homeWinProb).toFixed(2));
                winProb = homeWinProb;
                scoreRank = (homeWinProb * 100) + ((hRec.winRate - aRec.winRate) * 25);
                if (match.statusState === 'post') isWon = match.homeScore > match.awayScore;
            } else if (category === 'single_away') {
                label = "Full Time Result: Away Win (2)";
                odd = realAwayOdd || parseFloat((1 / awayWinProb).toFixed(2));
                winProb = awayWinProb;
                scoreRank = (awayWinProb * 100) + ((aRec.winRate - hRec.winRate) * 25);
                if (match.statusState === 'post') isWon = match.awayScore > match.homeScore;
            } else if (category === 'single_over15') {
                label = "Total Goals: Over 1.5 Goals";
                odd = parseFloat(Math.max(1.15, (1 / over15Prob)).toFixed(2));
                winProb = over15Prob;
                scoreRank = (over15Prob * 100) + (realOverUnder ? realOverUnder * 5 : 0);
                if (match.statusState === 'post') isWon = (match.homeScore + match.awayScore) >= 2;
            } else if (category === 'single_btts') {
                label = "Both Teams To Score: Yes (BTTS)";
                odd = parseFloat(Math.max(1.50, (1 / bttsProb)).toFixed(2));
                winProb = bttsProb;
                scoreRank = (bttsProb * 100) + (balancedStrength * 15);
                if (match.statusState === 'post') isWon = (match.homeScore > 0 && match.awayScore > 0);
            }

            if (hRec.played === 0 && aRec.played === 0) {
                scoreRank -= 15;
            }

            const confidencePct = `${(winProb * 100).toFixed(1)}%`;
            const oddsSourceText = (realHomeOdd || realAwayOdd)
                ? `Live Bookmaker Line (${match.oddsProvider || 'Market'}) | O/U Line: ${realOverUnder || 'N/A'}`
                : `Model Fair Odds Derived from Season Standings`;

            const detailedAnalysis = `
                <div>• <strong class="text-gray-900 dark:text-white">Home Season Record:</strong> ${match.home} (${hRec.summary} — ${(hRec.winRate * 100).toFixed(0)}% Win Rate)</div>
                <div>• <strong class="text-gray-900 dark:text-white">Away Season Record:</strong> ${match.away} (${aRec.summary} — ${(aRec.winRate * 100).toFixed(0)}% Win Rate)</div>
                <div>• <strong class="text-gray-900 dark:text-white">Market & Odds Feed:</strong> ${oddsSourceText}</div>
                <div>• <strong class="text-gray-900 dark:text-white">Model Win Probability:</strong> ${confidencePct} Calculated Edge</div>
                <div>• <strong class="text-gray-900 dark:text-white">Recent Form & Venue:</strong> ${match.homeForm ? `Home Form: ${match.homeForm}` : 'Official League Fixture'} ${match.venue ? `at ${match.venue}` : ''}</div>
            `;

            return {
                label,
                odd,
                confidence: confidencePct,
                analysis: detailedAnalysis,
                isWon,
                isFinished: match.statusState === 'post',
                scoreRank
            };
        }

        async function fetchRealFixtures(dateObj) {
            const compactDate = getYYYYMMDD(dateObj);
            let fixtures = [];
            const espnLeagues = ['eng.1', 'esp.1', 'ita.1', 'ger.1', 'fra.1', 'uefa.champions', 'uefa.europa', 'usa.1', 'ned.1', 'por.1'];

            const requests = espnLeagues.map(lg =>
                fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${compactDate}`)
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => null)
            );

            const results = await Promise.all(requests);
            results.forEach(data => {
                if (data && Array.isArray(data.events)) {
                    const leagueName = (data.leagues && data.leagues[0] && data.leagues[0].name) || "Official League";
                    data.events.forEach(ev => {
                        const comp = ev.competitions && ev.competitions[0];
                        if (comp && comp.competitors && comp.competitors.length === 2) {
                            const homeObj = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors[0];
                            const awayObj = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors[1];
                            const homeName = homeObj.team.displayName;
                            const awayName = awayObj.team.displayName;

                            if (!fixtures.some(f => f.home === homeName && f.away === awayName)) {
                                const dt = new Date(ev.date);
                                const timeStr = isNaN(dt) ? "19:00" : dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                                const statusState = (ev.status && ev.status.type && ev.status.type.state) || "pre";

                                const homeRecord = (homeObj.records && homeObj.records[0] && homeObj.records[0].summary) || "";
                                const awayRecord = (awayObj.records && awayObj.records[0] && awayObj.records[0].summary) || "";

                                const homeForm = homeObj.form || "";
                                const venue = (comp.venue && comp.venue.fullName) || "";

                                const oddsObj = (comp.odds && comp.odds[0]) || null;
                                const homeMoneyline = oddsObj && oddsObj.homeTeamOdds ? oddsObj.homeTeamOdds.moneyLine : null;
                                const awayMoneyline = oddsObj && oddsObj.awayTeamOdds ? oddsObj.awayTeamOdds.moneyLine : null;
                                const overUnderLine = oddsObj ? oddsObj.overUnder : null;
                                const oddsProvider = oddsObj && oddsObj.provider ? oddsObj.provider.name : null;

                                fixtures.push({
                                    id: `${homeName}_vs_${awayName}`,
                                    home: homeName,
                                    away: awayName,
                                    league: leagueName,
                                    time: timeStr,
                                    statusState: statusState,
                                    homeScore: parseInt(homeObj.score, 10) || 0,
                                    awayScore: parseInt(awayObj.score, 10) || 0,
                                    homeRecord,
                                    awayRecord,
                                    homeForm,
                                    venue,
                                    homeMoneyline,
                                    awayMoneyline,
                                    overUnderLine,
                                    oddsProvider
                                });
                            }
                        }
                    });
                }
            });

            return fixtures;
        }

        async function fetchMatchData(dateObj, isBackground = false) {
            selectedDateObj = dateObj;
            const container = document.getElementById('matchFeedContainer');
            if (!container) return;

            const today = new Date();
            const isToday = dateObj.toDateString() === today.toDateString();
            document.getElementById('sectionTitleDate').textContent = isToday
                ? "TODAY'S"
                : dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();

            if (!isBackground) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-8 text-center space-y-3">
                        <div class="inline-block w-8 h-8 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 font-mono">Analyzing Live Standings & Market Odds...</p>
                    </div>
                `;
            }

            const matches = await fetchRealFixtures(dateObj);

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-8 text-center space-y-3">
                        <p class="text-xs text-gray-600 dark:text-gray-300 font-mono">No matches found for this date. Please select another date (-60 to +30 days).</p>
                    </div>
                `;
                document.getElementById('totalOddsBadge').textContent = `ODDS: 0.00`;
                return;
            }

            const compactDateStr = getYYYYMMDD(dateObj);

            const evaluatedList = matches.map(m => ({
                match: m,
                eval: evaluatePickWithRealData(m, currentCategory)
            }));

            const lockedMatchId = getLockedPick(compactDateStr, currentCategory);
            let bestPick = null;

            if (lockedMatchId) {
                bestPick = evaluatedList.find(item => item.match.id === lockedMatchId);
            }

            if (!bestPick) {
                evaluatedList.sort((a, b) => b.eval.scoreRank - a.eval.scoreRank);
                bestPick = evaluatedList[0];
                saveLockedPick(compactDateStr, currentCategory, bestPick.match.id);
            }

            const m = bestPick.match;
            const evaluation = bestPick.eval;

            document.getElementById('totalOddsBadge').textContent = `ODDS: ${evaluation.odd.toFixed(2)}`;

            let badgeHtml = `<span class="bg-amber-500 text-gray-950 px-3 py-1 rounded-xl text-sm font-mono font-black shadow-lg">@ ${evaluation.odd.toFixed(2)}</span>`;
            if (evaluation.isFinished) {
                if (evaluation.isWon) {
                    badgeHtml = `<span class="bg-emerald-500 text-gray-950 px-3 py-1 rounded-xl text-xs font-mono font-black shadow-lg flex items-center gap-1">✅ WON (${m.homeScore}-${m.awayScore})</span>`;
                } else {
                    badgeHtml = `<span class="bg-red-500 text-white px-3 py-1 rounded-xl text-xs font-mono font-black shadow-lg flex items-center gap-1">❌ LOST (${m.homeScore}-${m.awayScore})</span>`;
                }
            } else if (m.statusState === 'in') {
                badgeHtml = `<span class="bg-emerald-500/20 text-emerald-500 dark:text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-xl text-xs font-mono font-bold flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 pulse-live"></span> LIVE (${m.homeScore}-${m.awayScore})</span>`;
            }

            container.innerHTML = `
                <div class="bg-gradient-to-br from-white to-gray-50 dark:from-gray-900 dark:to-gray-900/90 border-2 border-emerald-500/50 rounded-2xl p-5 space-y-4 shadow-xl">
                    <div class="flex items-center justify-between text-xs text-amber-500 font-mono font-bold">
                        <span>🏆 ${m.league}</span>
                        <span>⏰ ${m.time}</span>
                    </div>
                    <div class="flex items-center justify-between font-extrabold text-lg text-gray-900 dark:text-white">
                        <span>${m.home} vs ${m.away}</span>
                        ${badgeHtml}
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl p-4 space-y-2.5 text-xs">
                        <div class="flex items-center justify-between text-emerald-500 dark:text-emerald-400 font-bold">
                            <span>📊 Live Data Highest-Probability Pick</span>
                            <span class="bg-emerald-500/20 border border-emerald-500/30 px-2.5 py-0.5 rounded text-[11px] font-mono font-extrabold text-emerald-600 dark:text-emerald-300">Model Prob: ${evaluation.confidence}</span>
                        </div>
                        <div class="text-gray-900 dark:text-white font-bold text-sm bg-white dark:bg-gray-900 p-2.5 rounded-lg border border-gray-200 dark:border-gray-800/80">
                            ${evaluation.label}
                        </div>
                        <div class="space-y-1 text-gray-600 dark:text-gray-300 font-mono text-[11px] pt-1">
                            ${evaluation.analysis}
                        </div>
                    </div>
                </div>
            `;
        }

        initRibbon();
        fetchMatchData(selectedDateObj, false);
    </script>
</body>
</html>
