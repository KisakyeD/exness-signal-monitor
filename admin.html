<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINS1 Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-950 text-white p-4 max-w-5xl mx-auto">
<h1 class="text-2xl font-black">WINS1 ADMIN 👑 — ObPay</h1>
<div class="flex gap-2 my-4"><input id="adminEmail" placeholder="Admin Email" class="flex-1 bg-gray-800 rounded-xl px-3 py-2 text-sm"><input id="adminPass" type="password" placeholder="Password" class="bg-gray-800 rounded-xl px-3 py-2 text-sm"><button onclick="adminLogin()" class="bg-amber-500 text-black font-black px-4 rounded-xl text-sm">Login</button></div>
<div class="grid grid-cols-3 gap-2 text-center my-4"><div class="bg-gray-900 rounded-xl p-3"><div id="statUsers" class="text-xl font-black">0</div><div class="text-[10px]">USERS</div></div><div class="bg-gray-900 rounded-xl p-3"><div id="statActive" class="text-xl font-black text-emerald-400">0</div><div class="text-[10px]">ACTIVE SUBS</div></div><div class="bg-gray-900 rounded-xl p-3"><div id="statPending" class="text-xl font-black text-amber-400">0</div><div class="text-[10px]">PENDING (ObPay)</div></div></div>
<h2 class="font-black mt-4">⏳ Pending — Verify in ObPay then Approve</h2><div id="pendingList" class="space-y-2 mt-2"></div>
<h2 class="font-black mt-6">👥 All Users & Subscriptions</h2><div id="usersList" class="space-y-2 mt-2"></div>
<script>
const supabaseClient = supabase.createClient("https://pumuqiqmtpdpzovjbodm.supabase.co","sb_publishable_NXijT4Pmy00wiSiZdi814Q_H6wnh45z");
async function adminLogin(){ const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('adminEmail').value,password:document.getElementById('adminPass').value}); if(error) alert(error.message); else loadAdmin(); }
function fmt(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?'—':x.toLocaleDateString(); }
async function loadAdmin(){
  const {data:profiles, error:pErr}=await supabaseClient.from('profiles').select('*').order('created_at',{ascending:false});
  if(pErr){ alert('Profiles error: '+pErr.message); return; }
  const {data:subs, error:sErr}=await supabaseClient.from('subscriptions').select('*, profiles(email,phone)').order('created_at',{ascending:false});
  if(sErr){ alert('Subs error: '+sErr.message); return; }
  document.getElementById('statUsers').textContent=profiles?.length||0;
  document.getElementById('statActive').textContent=subs?.filter(s=>s.status==='active').length||0;
  document.getElementById('statPending').textContent=subs?.filter(s=>s.status==='pending').length||0;
  document.getElementById('pendingList').innerHTML=(subs?.filter(s=>s.status==='pending')||[]).map(s=>`<div class="bg-gray-900 rounded-xl p-3 flex justify-between items-center"><div><b>${s.profiles?.email||'no email'}</b> • ${s.profiles?.phone||s.phone||''}<br><span class="text-xs">${s.plan} - UGX ${s.amount_ugx||s.amount_usd} - <b>${s.payment_method||'obpay'}</b> - Ref: ${s.obpay_reference||'—'} - Ends: ${fmt(s.end_date)}</span></div><div class="flex gap-2"><button onclick="approveSub('${s.id}','${s.plan}')" class="bg-emerald-500 px-3 py-1 rounded-lg text-xs font-black">APPROVE</button><button onclick="rejectSub('${s.id}')" class="bg-red-500 px-3 py-1 rounded-lg text-xs font-black">REJECT</button></div></div>`).join('')||'No pending';
  document.getElementById('usersList').innerHTML=(subs||[]).map(s=>`<div class="bg-gray-900 rounded-xl p-3 flex justify-between"><div><b>${s.profiles?.email||'no email'}</b><br><span class="text-xs">${s.plan} - ${s.status} - Until ${fmt(s.end_date)}</span></div><div class="flex gap-1"><button onclick="extendSub('${s.id}',7)" class="bg-blue-500 px-2 py-1 rounded text-xs">+7 Days</button><button onclick="blockUser('${s.user_id}')" class="bg-red-600 px-2 py-1 rounded text-xs">Block</button></div></div>`).join('');
}
async function approveSub(id,plan){
  const days = plan==='1-week'||plan==='weekly'?7 : plan==='1-month'||plan==='monthly'?30 : plan==='3-months'?90 : plan==='6weeks'||plan==='6-weeks'?42 : 30;
  const start = new Date(); const end = new Date(); end.setDate(end.getDate()+days);
  const {error}=await supabaseClient.from('subscriptions').update({status:'active', start_date:start.toISOString(), end_date:end.toISOString()}).eq('id',id);
  if(error){ alert(error.message); return; }
  alert('Approved! Active for '+days+' days'); loadAdmin();
}
async function rejectSub(id){ const {error}=await supabaseClient.from('subscriptions').update({status:'rejected'}).eq('id',id); if(error) alert(error.message); loadAdmin(); }
async function extendSub(id,days){ const {data}=await supabaseClient.from('subscriptions').select('end_date').eq('id',id).single(); let d=data?.end_date?new Date(data.end_date):new Date(); if(isNaN(d)) d=new Date(); d.setDate(d.getDate()+days); await supabaseClient.from('subscriptions').update({end_date:d.toISOString(),status:'active'}).eq('id',id); loadAdmin(); }
async function blockUser(uid){ await supabaseClient.from('profiles').update({is_blocked:true}).eq('id',uid); alert('Blocked'); loadAdmin(); }
</script></body></html>
